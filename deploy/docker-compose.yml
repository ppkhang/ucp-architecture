services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ucp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ucp}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ucp}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ucp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-ucp}
      REDIS_URL: redis://redis:6379/0
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:?set MOCK_WEBHOOK_SECRET in .env}
      WORKERS_INTERVAL_SECONDS: 5
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-platform:
    build:
      context: ..
    command: ["uvicorn", "mock_platform.main:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      MOCK_MODE: ${MOCK_MODE:-always_succeed}
      MOCK_BASE_URL: ${MOCK_BASE_URL:-http://localhost:9000}
      MOCK_WEBHOOK_URL: ${MOCK_WEBHOOK_URL:-http://api:8000/v1/platform-events/mock}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:?set MOCK_WEBHOOK_SECRET in .env}
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/health')"]
      interval: 10s
      retries: 5

volumes:
  pgdata:
