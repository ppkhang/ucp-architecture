services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ucp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucp}
      POSTGRES_DB: ${POSTGRES_DB:-ucp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ucp}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ucp}:${POSTGRES_PASSWORD:-ucp}@postgres:5432/${POSTGRES_DB:-ucp}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
