[project]
name = "ucp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",  # Postgres driver
    "pyjwt>=2.9",  # 5 minute agent JWT
    "cryptography>=43",  # Fernet for platform tokens at rest (hard rule 12)
    "httpx>=0.27",  # calls to the platform OAuth endpoints
]

[project.optional-dependencies]
# the official MCP SDK (spec 2026-07-28), only needed to run mcp_server/
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6", "openapi-spec-validator>=0.7"]

[tool.setuptools.packages.find]
include = ["ucp*", "mock_platform*", "mcp_server*"]

[tool.setuptools.package-data]
mock_platform = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
